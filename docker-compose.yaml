version: '3.8'

services:
  backend:
    build: ./
    container_name: tunefinder_backend
    ports:
      - "5000:5000"
    volumes:
      - ./src:/app
    env_file:
      - ./.env
    environment:
      - FLASK_APP=main
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: tunefinder_frontend
    ports:
      - "8080:80"
    volumes:
      - ../tunefinder-front-end/src:/usr/share/nginx/html
    restart: unless-stopped